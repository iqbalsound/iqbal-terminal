name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zstd
      - run: npm ci
      - run: npx electron-builder --linux deb rpm pacman AppImage --publish never
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "dist/*.deb\ndist/*.rpm\ndist/*.pacman\ndist/*.AppImage" }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*.exe" }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with: { files: "artifacts/**/*" }
