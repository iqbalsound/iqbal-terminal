# Builds the Windows installer (Iqbal-Terminal-Setup-<version>.exe) and attaches it to the GitHub Release.
# Trigger: push a tag such as v2.0.0 (over SSH), or run it by hand from the Actions tab.
name: Release Windows EXE
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write            # lets the built-in token create the release and upload files

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --win nsis --publish never
        env:
          # Optional code signing. Add these two repository secrets to remove "Unknown publisher".
          # WIN_CSC_LINK = base64 of your .pfx file (or an https URL to it), WIN_CSC_KEY_PASSWORD = its password.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Show checksums
        shell: pwsh
        run: Get-FileHash dist\*.exe -Algorithm SHA256 | Format-Table Hash, Path -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
