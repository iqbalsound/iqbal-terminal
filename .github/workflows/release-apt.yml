# Publishes a signed APT repository as assets of a GitHub Release tagged "apt".
# (A .deb is over GitHub's 100 MB git file limit, so it cannot live in a branch; Release assets allow 2 GB.)
name: Publish APT repository
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - run: npm ci
      - run: npx electron-builder --linux deb --publish never
      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: bash scripts/import-gpg-key.sh
      - name: Build and sign the repository files
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: bash scripts/make-apt-flat.sh apt-flat "$(ls dist/*.deb | head -1)" "${{ secrets.APT_GPG_KEY_ID }}"
      - name: Publish to the "apt" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apt
          name: APT repository (used by apt - please do not delete)
          body: |
            Signed APT repository files for Iqbal Terminal. Install instructions are in docs/PUBLISHING-REPOS.md.
          prerelease: true
          make_latest: "false"
          files: apt-flat/*
